<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>micro:bit пульт</title>
<style>
body{font-family:sans-serif;text-align:center;touch-action:manipulation;user-select:none}
.pad{display:grid;grid-template-columns:repeat(3,90px);gap:10px;justify-content:center;margin-top:20px}
.pad button{height:90px;font-size:36px;border-radius:16px}
</style></head>
<body>
<button id="c" style="font-size:22px;padding:14px">Підключити micro:bit</button>
<p id="s">Не підключено</p>
<div class="pad">
<span></span><button data-c="F">▲</button><span></span>
<button data-c="L">◀️</button><button data-c="S">■</button><button data-c="R">▶️</button>
<span></span><button data-c="B">▼</button><span></span>
</div>
<script>
const SVC="6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const RX="6e400002-b5a3-f393-e0a9-e50e24dcca9e";
let ch=null;
const st=document.getElementById("s");

document.getElementById("c").onclick=async()=>{
  try{
    const dev=await navigator.bluetooth.requestDevice({
      filters:[{namePrefix:"BBC micro:bit"}],optionalServices:[SVC]});
    const srv=await dev.gatt.connect();
    const svc=await srv.getPrimaryService(SVC);
    ch=await svc.getCharacteristic(RX);
    st.textContent="Підключено";
  }catch(e){st.textContent="Помилка: "+e.message}
};

function send(c){
  if(!ch)return;
  const d=new TextEncoder().encode(c+"\n");
  ch.writeValueWithoutResponse(d).catch(()=>ch.writeValue(d).catch(()=>{}));
}

document.querySelectorAll(".pad button").forEach(b=>{
  const c=b.dataset.c;
  b.addEventListener("pointerdown",e=>{e.preventDefault();send(c)});
  if(c!=="S"){
    ["pointerup","pointercancel","pointerleave"].forEach(ev=>
      b.addEventListener(ev,()=>send("S")));
  }
});
</script></body></html>

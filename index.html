<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PS4 → micro:bit</title></head>
<body style="font-family:sans-serif;text-align:center">
<button id="c" style="font-size:24px;padding:16px">Підключити micro:bit</button>
<p id="s">Не підключено</p>
<script>
const SVC = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const RX  = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
let ch, last = "";

document.getElementById("c").onclick = async () => {
  const dev = await navigator.bluetooth.requestDevice({
    filters: [{ namePrefix: "BBC micro:bit" }],
    optionalServices: [SVC]
  });
  const srv = await dev.gatt.connect();
  const svc = await srv.getPrimaryService(SVC);
  ch = await svc.getCharacteristic(RX);
  document.getElementById("s").textContent = "Підключено. Натисни щось на геймпаді.";
  loop();
};

function loop() {
  const gp = navigator.getGamepads()[0];
  if (gp && ch) {
    const x = gp.axes[0], y = gp.axes[1];
    let cmd = "S";
    if (y < -0.5 || gp.buttons[12].pressed) cmd = "F";
    else if (y > 0.5 || gp.buttons[13].pressed) cmd = "B";
    else if (x < -0.5 || gp.buttons[14].pressed) cmd = "L";
    else if (x > 0.5 || gp.buttons[15].pressed) cmd = "R";
    if (cmd !== last) {
      last = cmd;
      ch.writeValueWithoutResponse(new TextEncoder().encode(cmd + "\n")).catch(()=>{});
    }
  }
  requestAnimationFrame(loop);
}
</script></body></html>
